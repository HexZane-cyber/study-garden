name: Deploy Study Garden
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/configure-pages@v5
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Build documentation and knowledge graph
        run: python build.py
      - name: Validate content, proposals and encryption
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node tests/planner.test.cjs
          node tests/backup.test.cjs
          node tests/review.test.cjs
          node tests/learning.test.cjs
          node tests/core.test.cjs
          node tests/chip-learning.test.cjs
          node tests/chip.test.cjs
          node tests/graph-transfer.test.cjs
          node tests/graph-interaction.test.cjs
          node tests/fluid.test.cjs
          node tests/gravity.test.cjs
          node tests/graph-label-layout.test.cjs
          node tests/graph3d.test.cjs
          node tests/graph-visuals.test.cjs
          node tests/liquid-surface.test.cjs
          node tests/article-activity.test.cjs
          node tests/contributions.test.cjs
          node tests/vault-formats.test.cjs
          node tests/vault.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
