site_name: 之芯
site_description: 课程、笔记与知识之间的连接。
site_author: HexZane
repo_url: https://github.com/HexZane-cyber/study-garden
repo_name: HexZane-cyber/study-garden
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
hooks:
  - hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/article-activity.js
  - assets/reading-model.js
  - assets/reading.js
  - assets/site-tools.js
  - assets/appearance.js
extra:
  generator: false
  giscus:
    repo_id: ''
    category_id: ''
copyright: 之芯 · 保持好奇，持续学习。
nav:
  - 首页: index.md
  - 学习工作台: dashboard.md
  - 复习卡: review.md
  - 如何使用这本手册: guide.md
  - 课程目录: catalog.md
  - 优质课程链接: course-links.md
  - 名校课程重点与先修: university-courses.md
  - 习题与提交: course-practice.md
  - 学习路线: roadmap.md
  - 电子信息与集成电路:
      - 学习路线与清华对标: ic-roadmap.md
