site_name: 之芯
site_description: 课程、笔记与知识之间的连接。
site_author: HexZane
repo_url: https://github.com/HexZane-cyber/study-garden
repo_name: HexZane-cyber/study-garden
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  custom_dir: overrides
  font: false
  icon:
    logo: material/book-open-page-variant
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换浅色模式
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换深色模式
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
plugins:
  - search:
      lang: [zh, en]
hooks:
  - hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
extra_css:
  - assets/extra.css
extra_javascript:
  - assets/article-activity.js
  - assets/reading.js
  - assets/site-tools.js
  - assets/appearance.js
extra:
  generator: false
  giscus:
    repo_id: ''
    category_id: ''
copyright: 之芯 · 保持好奇，持续学习。
nav:
  - 首页: index.md
  - 学习工作台: dashboard.md
  - 复习卡: review.md
  - 如何使用这本手册: guide.md
  - 课程目录: catalog.md
  - 学习路线: roadmap.md
  - 必学工具:
      - Missing Semester: tools/missing-semester.md
      - Git 与知识管理: tools/git.md
      - Markdown 写作: tools/markdown.md
  - 数学基础:
      - MIT 18.06 线性代数: courses/math.md
  - 编程入门:
      - CS50x 计算机导论: courses/cs-intro.md
      - CS50P Python: courses/python.md
  - 数据结构与算法:
      - MIT 6.006 算法: courses/algorithms.md
  - 计算机系统:
      - CMU 15-213 系统: courses/systems.md
      - 操作系统: courses/os.md
      - 计算机网络: courses/networks.md
      - 数据库系统: courses/databases.md
  - 人工智能:
      - Google MLCC: courses/ml.md
  - 我的笔记:
      - 笔记索引: notes/index.md
  - 社区课程:
      - 已收录课程: courses/community/index.md
  - 共建课程: contribute.md
  - 我的书签: library.md
  - 个人私密空间: private.md
  - 知识关系图: graph.md
  - 上传与发布: publish.md
  - 交流讨论: discussion.md
